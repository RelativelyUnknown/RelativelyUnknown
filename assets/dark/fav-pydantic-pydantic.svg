<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0 96" width="1000.0" height="96" role="img" aria-label="pydantic. Data validation that made Python's type hints load-bearing."><style>svg{--canvas:#0d1117;--subtle:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9198a1;--accent:#3fb950;--link:#4493f8}.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.bar{animation:grow 1s cubic-bezier(.2,.75,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.rise,.bar,.pulse{animation:none;opacity:1;transform:none}}</style><g transform="translate(0.000,0)"><rect x="0.5" y="0.5" width="999.0" height="95" rx="6" fill="var(--canvas)" stroke="var(--border)" stroke-width="1"/><circle cx="38.0" cy="48.0" r="18.0" fill="var(--subtle)" stroke="var(--border)"/><text x="38.0" y="54.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="var(--muted)" text-anchor="middle">P</text><text x="68" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="var(--link)" text-anchor="start">pydantic</text><text x="68" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="var(--muted)" text-anchor="start">Data validation that made Python's type hints load-bearing.</text></g></svg>
