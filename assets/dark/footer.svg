<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="Happy to talk about developer tooling and anything data engineering related."><style>svg{--canvas:#0d1117;--subtle:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9198a1;--accent:#3fb950;--link:#4493f8}.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.bar{animation:grow 1s cubic-bezier(.2,.75,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.rise,.bar,.pulse{animation:none;opacity:1;transform:none}}</style><rect x="0.5" y="0.5" width="999" height="75" rx="6" fill="var(--canvas)" stroke="var(--border)" stroke-width="1"/><circle cx="32" cy="41" r="5" fill="var(--accent)" class="pulse"/><text x="50" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="var(--fg)" text-anchor="start">Happy to talk about developer tooling and anything data engineering related.</text></svg>
