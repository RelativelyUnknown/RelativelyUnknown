<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 34" width="1000" height="34" role="img" aria-label="Personal favourites."><style>svg{--canvas:#0d1117;--subtle:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9198a1;--accent:#3fb950;--link:#4493f8}.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.bar{animation:grow 1s cubic-bezier(.2,.75,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.rise,.bar,.pulse{animation:none;opacity:1;transform:none}}</style><g class="rise"><text x="28" y="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="var(--fg)" text-anchor="start">Personal favourites</text></g></svg>
