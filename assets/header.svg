<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" width="1000" height="224" role="img" aria-label="RelativelyUnknown, data and AI engineering. I write developer tooling for data platforms: parsers, linters, and a couple of VS Code extensions. Most of it started as something that annoyed me at work. Mostly TypeScript, Python and JavaScript, across 8 public repositories. 715 commits in the past year on 93 days, 60 of them on the busiest day."><style>svg{--canvas:#ffffff;--subtle:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#1a7f37;--link:#0969da}.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.bar{animation:grow 1s cubic-bezier(.2,.75,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.rise,.bar,.pulse{animation:none;opacity:1;transform:none}}</style><rect x="0.5" y="0.5" width="999" height="223" rx="6" fill="var(--canvas)" stroke="var(--border)" stroke-width="1"/><g class="rise"><circle cx="32" cy="21" r="3.5" fill="var(--accent)"/><text x="42" y="25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="var(--muted)" text-anchor="start">Data and AI engineering</text></g><g class="rise" style="animation-delay:.05s"><text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="var(--fg)" text-anchor="start">RelativelyUnknown</text></g><g class="rise" style="animation-delay:.1s"><text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="var(--fg)" text-anchor="start">I write developer tooling for data platforms: parsers,</text><text x="28" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="var(--fg)" text-anchor="start">linters, and a couple of VS Code extensions. Most of it</text><text x="28" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="var(--fg)" text-anchor="start">started as something that annoyed me at work.</text></g><g class="rise" style="animation-delay:0.20s"><g transform="translate(28,160) scale(0.87500)" fill="var(--muted)"><path d="m11.28 3.22 4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L13.94 8l-3.72-3.72a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215Zm-6.56 0a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L2.06 8l3.72 3.72a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L.47 8.53a.75.75 0 0 1 0-1.06Z"/></g><text x="50" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="var(--muted)" text-anchor="start">Mostly TypeScript, Python and JavaScript</text></g><g class="rise" style="animation-delay:0.26s"><g transform="translate(28,184) scale(0.87500)" fill="var(--muted)"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></g><text x="50" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="var(--muted)" text-anchor="start">8 public repositories</text></g><g class="rise" style="animation-delay:0.28s"><text x="655.3333333333