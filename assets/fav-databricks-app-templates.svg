<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500.0 96" width="500.0" height="96" role="img" aria-label="databricks/app-templates."><style>svg{--canvas:#ffffff;--subtle:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#1a7f37;--link:#0969da}.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.bar{animation:grow 1s cubic-bezier(.2,.75,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.rise,.bar,.pulse{animation:none;opacity:1;transform:none}}</style><g transform="translate(8.000,0)"><rect x="0.5" y="0.5" width="491.0" height="95" rx="6" fill="var(--canvas)" stroke="var(--border)" stroke-width="1"/><clipPath id="av-databricks"><circle cx="38.0" cy="48.0" r="18.0"/></clipPath><image href="data:image/png;base64," x="20" y="30" width="36" height="36" preserveAspectRatio="xMidYMid slice" clip-path="url(#av-databricks)"/><text x="68" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="var(--link)"><tspan font-weight="600">app-templates</tspan><tspan dx="7" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="var(--muted)">databricks</tspan></text></g></svg>
